<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Messages — The Missing Manual</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <style>
    /* Scoped to this page. Every color/spacing token below is one already
       defined in css/style.css — nothing new is added to that file. */
    .msg-wrap{display:flex;height:calc(100vh - 61px);border-top:1px solid var(--border)}
    .msg-list-panel{width:320px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--surface)}
    .msg-list-head{padding:18px 20px;border-bottom:1px solid var(--border)}
    .msg-list-head h2{font-size:1.25rem}
    .msg-list{flex:1;overflow-y:auto}
    .msg-row{display:flex;align-items:flex-start;gap:12px;padding:14px 20px;cursor:pointer;border-bottom:1px solid var(--border);transition:var(--ease)}
    .msg-row:hover{background:var(--surface-2)}
    .msg-row.active{background:var(--indigo-soft)}
    .msg-row-avatar{width:36px;height:36px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;color:var(--text-3)}
    .msg-row-body{flex:1;min-width:0}
    .msg-row-lesson{font-size:11px;font-weight:700;color:var(--indigo);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .msg-row-preview{font-size:13px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .msg-row.unread .msg-row-preview{color:var(--text-1);font-weight:600}
    .msg-row-time{font-size:11px;color:var(--text-3);flex-shrink:0;margin-top:2px}
    .msg-row-dot{width:8px;height:8px;border-radius:50%;background:var(--crimson);flex-shrink:0;margin-top:5px}
    .msg-empty{padding:48px 24px;text-align:center;color:var(--text-3);font-size:13.5px}

    .msg-thread-panel{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
    .msg-thread-head{padding:14px 24px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;gap:12px}
    .msg-back-btn{display:none;background:none;border:none;cursor:pointer;color:var(--text-2);padding:4px;font-size:16px}
    .msg-thread-title{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .msg-thread-sub{font-size:11.5px;color:var(--text-3)}
    .msg-thread-link{font-size:12px;color:var(--indigo);font-weight:600;margin-left:auto;white-space:nowrap}
    .msg-body{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:10px}
    .msg-bubble{max-width:70%;padding:10px 14px;border-radius:var(--r-lg);font-size:13.5px;line-height:1.55;word-wrap:break-word}
    .msg-bubble.mine{align-self:flex-end;background:var(--indigo);color:#fff;border-bottom-right-radius:4px}
    .msg-bubble.theirs{align-self:flex-start;background:var(--surface);border:1px solid var(--border);color:var(--text-1);border-bottom-left-radius:4px}
    .msg-bubble-time{display:block;font-size:10px;margin-top:4px;opacity:.65}
    .msg-input-row{padding:14px 20px;border-top:1px solid var(--border);background:var(--surface);display:flex;gap:10px;align-items:flex-end}
    .msg-input-row textarea{flex:1;resize:none;border:1.5px solid var(--border);border-radius:var(--r-sm);padding:10px 12px;font-size:13.5px;font-family:inherit;color:var(--text-1);background:var(--surface);outline:none;max-height:120px}
    .msg-input-row textarea:focus{border-color:var(--indigo);box-shadow:0 0 0 3px var(--indigo-soft)}
    .msg-send-btn{width:38px;height:38px;border-radius:50%;background:var(--indigo);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:none;cursor:pointer;transition:var(--ease)}
    .msg-send-btn:hover{background:var(--indigo-2)}
    .msg-send-btn svg{width:15px;height:15px}
    .msg-thread-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-3);gap:8px;text-align:center;padding:24px}
    .msg-pending-note{font-size:12px;color:var(--text-3);text-align:center;padding:8px 20px 0}

    @media(max-width:900px){
      .msg-wrap{height:calc(100vh - 130px)}
      .msg-list-panel{width:100%;border-right:none}
      .msg-wrap.thread-open .msg-list-panel{display:none}
      .msg-thread-panel{display:none}
      .msg-wrap.thread-open .msg-thread-panel{display:flex}
      .msg-back-btn{display:flex}
    }
  </style>
</head>
<body>
<div class="app-wrapper ready">
  <div id="sb"></div>
  <main class="main-content">
    <div id="tb"></div>

    <div id="noauth" class="hidden" style="padding:80px 44px;text-align:center">
      <div style="font-size:40px;margin-bottom:16px">🔒</div>
      <h2 style="margin-bottom:8px">Sign in to see your messages</h2>
      <p style="margin-bottom:24px">Conversations you start about a lesson show up here.</p>
      <div style="display:flex;gap:10px;justify-content:center">
        <a href="login.html" class="btn btn-ghost">Sign in</a>
        <a href="signup.html" class="btn btn-primary">Create account</a>
      </div>
    </div>

    <div id="msg-content" class="msg-wrap">
      <div class="msg-list-panel">
        <div class="msg-list-head"><h2>Messages</h2></div>
        <div class="msg-list" id="msg-list"></div>
      </div>
      <div class="msg-thread-panel" id="msg-thread-panel">
        <div class="msg-thread-empty" id="msg-thread-empty">
          <div style="font-size:30px;opacity:.3">💬</div>
          <p style="font-size:13.5px">Pick a conversation, or message a lesson author from any lesson page.</p>
        </div>
      </div>
    </div>
  </main>
</div>
<div class="toast"></div>
<div id="mn"></div>

<script src="../js/app.js"></script>
<script src="../js/api.js"></script>
<script>
  document.getElementById('sb').innerHTML = buildSidebar('messages');
  document.getElementById('tb').innerHTML = buildTopbar();
  document.getElementById('mn').innerHTML = buildMobileNav('messages');

  if (!Auth.isLoggedIn()) {
    document.getElementById('noauth').classList.remove('hidden');
    document.getElementById('msg-content').classList.add('hidden');
  } else {
    boot();
  }

  var conversations = [];
  var openConversationId = null;
  var pendingLessonId = null;   // set when we arrived via ?lesson=... with no thread yet
  var pendingLessonTitle = null;
  var pollTimer = null;

  function timeAgo(iso){
    var s = Math.floor((Date.now() - new Date(iso).getTime())/1000);
    if(s<60) return 'just now';
    if(s<3600) return Math.floor(s/60)+'m ago';
    if(s<86400) return Math.floor(s/3600)+'h ago';
    if(s<2592000) return Math.floor(s/86400)+'d ago';
    return Math.floor(s/2592000)+'mo ago';
  }

  function boot(){
    var P = new URLSearchParams(location.search);
    var lessonParam = P.get('lesson');
    var titleParam = P.get('title');

    loadConversations(function(){
      if (lessonParam) {
        var existing = null;
        for (var i = 0; i < conversations.length; i++) {
          if (conversations[i].lesson && conversations[i].lesson.id === lessonParam) { existing = conversations[i]; break; }
        }
        if (existing) {
          openConversation(existing.id);
        } else {
          pendingLessonId = lessonParam;
          pendingLessonTitle = titleParam || 'this lesson';
          showComposeNew();
        }
      }
    });

    pollTimer = setInterval(function(){
      loadConversations(function(){
        if (openConversationId) refreshOpenThread();
      });
    }, 12000);
  }

  function loadConversations(cb){
    Api.getConversations().then(function(res){
      conversations = (res && res.conversations) || [];
      renderList();
      if (cb) cb();
    }).catch(function(){
      document.getElementById('msg-list').innerHTML = '<div class="msg-empty">Could not load messages. Check your connection.</div>';
    });
  }

  function renderList(){
    var el = document.getElementById('msg-list');
    if (!conversations.length) {
      el.innerHTML = '<div class="msg-empty">No conversations yet. Message a lesson author from any lesson page to start one.</div>';
      return;
    }
    el.innerHTML = conversations.map(function(c){
      var title = c.lesson ? c.lesson.title : 'Deleted lesson';
      var preview = c.lastMessage ? (c.lastMessage.isMine ? 'You: ' : '') + c.lastMessage.content : (c.status === 'pending' ? 'Message request sent' : 'No messages yet');
      var time = c.lastMessage ? timeAgo(c.lastMessage.createdAt) : '';
      var unread = c.unreadCount > 0;
      return '<div class="msg-row ' + (unread ? 'unread' : '') + ' ' + (c.id === openConversationId ? 'active' : '') + '" onclick="openConversation(\'' + c.id + '\')">'
        + '<div class="msg-row-avatar">?</div>'
        + '<div class="msg-row-body">'
        + '<div class="msg-row-lesson">' + escapeHtml(title) + '</div>'
        + '<div class="msg-row-preview">' + escapeHtml(preview) + '</div>'
        + '</div>'
        + '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">'
        + '<div class="msg-row-time">' + time + '</div>'
        + (unread ? '<div class="msg-row-dot"></div>' : '')
        + '</div>'
        + '</div>';
    }).join('');
  }

  function escapeHtml(s){
    var d = document.createElement('div');
    d.textContent = s == null ? '' : s;
    return d.innerHTML;
  }

  function showComposeNew(){
    var wrap = document.querySelector('.msg-wrap');
    wrap.classList.add('thread-open');
    var panel = document.getElementById('msg-thread-panel');
    panel.innerHTML = ''
      + '<div class="msg-thread-head">'
      + '<button class="msg-back-btn" onclick="closeThread()">←</button>'
      + '<div><div class="msg-thread-title">' + escapeHtml(pendingLessonTitle) + '</div><div class="msg-thread-sub">New message · anonymous until sent</div></div>'
      + '</div>'
      + '<div class="msg-thread-empty"><div style="font-size:26px;opacity:.3">✍️</div><p style="font-size:13px">Say what you want to ask about this lesson. The author sees your message and the lesson it\'s about — nothing else.</p></div>'
      + '<div class="msg-input-row">'
      + '<textarea id="msg-input" rows="1" placeholder="Write your message…"></textarea>'
      + '<button class="msg-send-btn" onclick="sendNew()">' + ic('send') + '</button>'
      + '</div>';
  }

  function sendNew(){
    var input = document.getElementById('msg-input');
    var text = input.value.trim();
    if (!text) return;
    input.disabled = true;
    Api.sendMessage({ lessonId: pendingLessonId, content: text }).then(function(res){
      if (res.error) { showToast(res.error); input.disabled = false; return; }
      var newId = res.conversationId;
      pendingLessonId = null;
      loadConversations(function(){ openConversation(newId); });
    }).catch(function(){ showToast('Could not send message'); input.disabled = false; });
  }

  function openConversation(id){
    openConversationId = id;
    var wrap = document.querySelector('.msg-wrap');
    wrap.classList.add('thread-open');
    renderList();
    Api.getConversation(id).then(function(res){
      if (res.error) { showToast(res.error); return; }
      renderThread(res);
      Api.markConversationRead(id).then(function(){ loadConversations(); });
    }).catch(function(){ showToast('Could not load conversation'); });
  }

  function refreshOpenThread(){
    if (!openConversationId) return;
    Api.getConversation(openConversationId).then(function(res){
      if (!res.error) renderThread(res);
    }).catch(function(){});
  }

  function renderThread(convo){
    var panel = document.getElementById('msg-thread-panel');
    var title = convo.lesson ? convo.lesson.title : 'Deleted lesson';
    var statusNote = convo.status === 'pending' ? '<div class="msg-pending-note">Waiting for a reply — they\'ll see this once they open it.</div>' : '';
    panel.innerHTML = ''
      + '<div class="msg-thread-head">'
      + '<button class="msg-back-btn" onclick="closeThread()">←</button>'
      + '<div style="min-width:0"><div class="msg-thread-title">' + escapeHtml(title) + '</div><div class="msg-thread-sub">Anonymous conversation</div></div>'
      + (convo.lesson ? '<a class="msg-thread-link" href="manual.html?cat=' + escapeHtml(convo.lesson.category) + '&lesson=' + escapeHtml(convo.lesson.id) + '">View lesson</a>' : '')
      + '</div>'
      + statusNote
      + '<div class="msg-body" id="msg-body"></div>'
      + '<div class="msg-input-row">'
      + '<textarea id="msg-reply-input" rows="1" placeholder="Type a message…" onkeydown="if(event.key===\'Enter\'&&!event.shiftKey){event.preventDefault();sendReply(\'' + convo.id + '\')}"></textarea>'
      + '<button class="msg-send-btn" onclick="sendReply(\'' + convo.id + '\')">' + ic('send') + '</button>'
      + '</div>';

    var body = document.getElementById('msg-body');
    body.innerHTML = convo.messages.map(function(m){
      return '<div class="msg-bubble ' + (m.isMine ? 'mine' : 'theirs') + '">' + escapeHtml(m.content)
        + '<span class="msg-bubble-time">' + timeAgo(m.createdAt) + '</span></div>';
    }).join('') || '<div class="msg-empty">No messages yet.</div>';
    body.scrollTop = body.scrollHeight;
  }

  function sendReply(conversationId){
    var input = document.getElementById('msg-reply-input');
    var text = input.value.trim();
    if (!text) return;
    input.value = '';
    Api.sendMessage({ conversationId: conversationId, content: text }).then(function(res){
      if (res.error) { showToast(res.error); return; }
      refreshOpenThread();
      loadConversations();
    }).catch(function(){ showToast('Could not send message'); });
  }

  function closeThread(){
    openConversationId = null;
    document.querySelector('.msg-wrap').classList.remove('thread-open');
    document.getElementById('msg-thread-panel').innerHTML = '<div class="msg-thread-empty" id="msg-thread-empty"><div style="font-size:30px;opacity:.3">💬</div><p style="font-size:13.5px">Pick a conversation, or message a lesson author from any lesson page.</p></div>';
    renderList();
  }
</script>
</body>
</html>
