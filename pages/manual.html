<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Manual — The Missing Manual</title>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body>
<div class="app-wrapper ready">
  <div id="sb"></div>
  <main class="main-content">
    <div id="tb"></div>
    <div id="mh"></div>
    <div class="tabs-bar" id="tabs"></div>
    <div class="page" id="lessons" style="max-width:820px"></div>
  </main>
</div>
<div id="sm"></div>
<div class="toast"></div>
<div id="mn"></div>

<script src="../js/app.js"></script><script src="../js/api.js"></script><script src="../js/loader.js"></script>
<script>
  const P = new URLSearchParams(location.search);
  const catId = P.get('cat') || 'freelancing';
  const focusId = P.get('lesson');
  const cat = DATA.categories.find(c=>c.id===catId) || DATA.categories[0];
  let lessons = [];

  document.title = `${cat.name} Manual — The Missing Manual`;
  document.getElementById('sb').innerHTML = buildSidebar('');
  document.getElementById('tb').innerHTML = buildTopbar(`Search ${cat.name} lessons…`);
  document.getElementById('sm').innerHTML = buildShareModal();
  document.getElementById('mn').innerHTML = buildMobileNav('explore');

  function timeAgo(iso){
    const s = Math.floor((Date.now() - new Date(iso).getTime())/1000);
    if(s<60) return 'just now';
    if(s<3600) return Math.floor(s/60)+'m ago';
    if(s<86400) return Math.floor(s/3600)+'h ago';
    if(s<2592000) return Math.floor(s/86400)+'d ago';
    return Math.floor(s/2592000)+'mo ago';
  }

  function renderHero(){
    document.getElementById('mh').innerHTML = `
      <div class="manual-hero">
        <div class="breadcrumb"><a href="../index.html">Home</a> › <a href="explore.html">Manuals</a> › <span>${cat.name}</span></div>
        <h1>${cat.icon} Missing Manual for ${cat.name}</h1>
        <p class="lead">Real lessons from people who learned the hard way. No theory, no fluff — only what actually happened. All submissions are anonymous.</p>
        <div class="manual-actions">
          <button class="btn btn-primary" onclick="location='submit.html'">${ic('plus')} Add your lesson</button>
          <button class="btn btn-ghost" onclick="openShare('Missing Manual for ${cat.name}',location.href)">${ic('share')} Share</button>
          <button class="btn btn-ghost" id="followBtn" onclick="toggleFollow()">Follow manual</button>
        </div>
        <div class="manual-stats">
          <span class="manual-stat">${ic('heart')} <strong>${lessons.length}</strong> lessons</span>
        </div>
      </div>`;
  }

  const TYPES = ['All','Things Nobody Tells You','Costly Mistakes','Red Flags','Time Savers','Regrets From Experience','Best Advice Received'];
  let activeType = 'All';

  document.getElementById('tabs').innerHTML = TYPES.map(t=>
    `<div class="tab ${t===activeType?'active':''}" onclick="filterBy('${t}',this)">${t}</div>`
  ).join('');

  function filterBy(t, el){
    activeType = t;
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    el.classList.add('active');
    render();
  }

  function render(){
    const list = activeType==='All' ? lessons : lessons.filter(l=>l.type===activeType);
    const m = document.getElementById('lessons');
    if(!list.length){
      m.innerHTML=`<div style="text-align:center;padding:60px 20px">
        <div style="font-size:32px;margin-bottom:12px;opacity:.3">📭</div>
        <h3 style="font-size:15px;margin-bottom:6px">No lessons here yet</h3>
        <p style="font-size:13px;color:var(--text-muted);margin-bottom:20px">Be the first to share what you know about this.</p>
        <a href="submit.html" class="btn btn-primary">Submit a lesson</a>
      </div>`;
      return;
    }
    m.innerHTML = list.map(l=>buildCard(l)).join('') + '<div style="height:80px"></div>';
    if(focusId){
      const el=document.getElementById(`lc-${focusId}`);
      if(el) setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'center'}),200);
    }
  }

  function buildCard(l){
    const wishes = l._count ? l._count.wishes : 0;
    const comments = l._count ? l._count.comments : 0;
    return `<div class="lesson-card" id="lc-${l.id}">
      <div class="lesson-card-head">
        <span class="section-badge">${l.type}</span>
        <h3>${l.title}</h3>
      </div>
      <div class="lesson-card-body">
        <div class="lesson-block">
          <span class="block-label">The situation</span>
          <div class="block-situation"><p>${l.situation}</p></div>
        </div>
        <div class="lesson-block">
          <span class="block-label">What happened</span>
          <div class="block-lesson"><p>${l.whatHappened}</p></div>
        </div>
        <div class="lesson-block">
          <span class="block-label">The lesson</span>
          <p style="font-size:14px;color:var(--text-primary);line-height:1.75">${l.lesson}</p>
        </div>
        <div class="lesson-block">
          <div class="block-advice"><span class="block-label">Advice for others</span><p>${l.advice}</p></div>
        </div>
      </div>
      <div class="lesson-card-foot">
        <div class="lesson-author">
          <div class="avatar" style="width:26px;height:26px;font-size:11px;background:var(--surface-2);color:var(--text-muted)">?</div>
          <div><div class="a-name">Anonymous</div><div class="a-time">${timeAgo(l.createdAt)}</div></div>
        </div>
        <div class="lesson-foot-actions">
          <button class="wish-btn" id="wb-${l.id}" onclick="toggleWish('${l.id}',this)">
            ${ic('heart')} <span id="wc-${l.id}">${wishes} I Wish I Knew This</span>
          </button>
          <button class="btn btn-ghost btn-sm" id="sb-${l.id}" onclick="toggleSave('${l.id}',this)">
            ${ic('bookmark')} Save
          </button>
          <button class="btn btn-ghost btn-sm" onclick="openShare('${l.title.replace(/'/g,"\\'")}',location.href+'&lesson=${l.id}')">
            ${ic('share')}
          </button>
        </div>
      </div>
    </div>`;
  }

  function toggleWish(id, btn){
    if(!Auth.isLoggedIn()){ location.href='login.html'; return; }
    Api.wishLesson(id).then(function(res){
      if(res.error){ showToast(res.error); return; }
      const span = document.getElementById(`wc-${id}`);
      const current = parseInt(span.textContent) || 0;
      const next = res.wished ? current+1 : Math.max(0, current-1);
      span.textContent = `${next} I Wish I Knew This`;
      btn.classList.toggle('active', res.wished);
      showToast(res.wished?'Wish added!':'Wish removed');
    }).catch(function(){ showToast('Could not connect to server'); });
  }

  function toggleSave(id, btn){
    if(!Auth.isLoggedIn()){ location.href='login.html'; return; }
    Api.saveLesson(id).then(function(res){
      if(res.error){ showToast(res.error); return; }
      btn.innerHTML = `${ic('bookmark')} ${res.saved?'Saved':'Save'}`;
      showToast(res.saved?'Lesson saved!':'Removed from saved');
    }).catch(function(){ showToast('Could not connect to server'); });
  }

  function toggleFollow(){
    if(!Auth.isLoggedIn()){ location.href='login.html'; return; }
    const btn = document.getElementById('followBtn');
    const now = btn.textContent.trim();
    btn.textContent = now==='Unfollow manual' ? 'Follow manual' : 'Unfollow manual';
    showToast(now==='Unfollow manual' ? 'Unfollowed' : `Following ${cat.name} manual`);
  }

  document.getElementById('lessons').innerHTML = `<div style="text-align:center;padding:60px 20px;color:var(--text-muted);font-size:14px">Loading lessons…</div>`;
  Api.getLessons(cat.id).then(function(res){
    lessons = res.lessons || [];
    renderHero();
    render();
  }).catch(function(){
    document.getElementById('lessons').innerHTML = `<div style="text-align:center;padding:60px 20px;color:var(--text-muted);font-size:14px">Could not load lessons. Check your connection.</div>`;
  });
</script>
</body>
</html>
