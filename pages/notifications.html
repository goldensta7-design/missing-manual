<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notifications — The Missing Manual</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="app-wrapper ready">
  <div id="sidebar-mount"></div>
  <main class="main-content">
    <div id="topbar-mount"></div>
    <div class="page" style="max-width:680px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px">
        <div>
          <h2 style="margin-bottom:4px">Notifications</h2>
          <p style="font-size:14px">Updates on your contributions and activity.</p>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="markAllRead()">Mark all read</button>
      </div>

      <div id="notif-list" style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden"></div>
      <div style="height:80px"></div>
    </div>
  </main>
</div>
<div class="toast"></div>
<div id="mobile-nav-mount"></div>
<script src="../js/app.js"></script><script src="../js/loader.js"></script>
<script>
  document.getElementById('sidebar-mount').innerHTML = buildSidebar('notif');
  document.getElementById('topbar-mount').innerHTML = buildTopbar();
  document.getElementById('mobile-nav-mount').innerHTML = buildMobileNav('profile');

  const NOTIFS = [
    { id: 1, unread: true, icon: '❤️', text: 'Someone wished they knew your lesson <strong>"Your first client will lowball you"</strong> earlier.', time: '2 minutes ago' },
    { id: 2, unread: true, icon: '💬', text: 'A new comment on your lesson: <strong>"This is exactly what happened to me. Thank you."</strong>', time: '1 hour ago' },
    { id: 3, unread: true, icon: '🔖', text: 'Your lesson was saved by 4 new people today.', time: '3 hours ago' },
    { id: 4, unread: false, icon: '🎉', text: 'Your lesson crossed <strong>100 wishes</strong>. You\'re helping people.', time: 'Yesterday' },
    { id: 5, unread: false, icon: '👤', text: 'Someone started following the <strong>Freelancing Manual</strong> after reading your lesson.', time: '2 days ago' },
    { id: 6, unread: false, icon: '⭐', text: 'You\'ve been awarded the <strong>First Contribution</strong> badge.', time: '3 days ago' },
  ];

  function renderNotifs(notifs) {
    document.getElementById('notif-list').innerHTML = notifs.map(n => `
      <div style="display:flex;align-items:flex-start;gap:14px;padding:16px 20px;border-bottom:1px solid var(--border);background:${n.unread ? '#FAFAF8' : 'var(--surface)'};cursor:pointer;transition:background 0.15s" onclick="markRead(${n.id}, this)">
        <div style="width:36px;height:36px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0">${n.icon}</div>
        <div style="flex:1">
          <div style="font-size:13.5px;color:var(--text-primary);line-height:1.6;margin-bottom:4px">${n.text}</div>
          <div style="font-size:11.5px;color:var(--text-muted)">${n.time}</div>
        </div>
        ${n.unread ? `<div style="width:8px;height:8px;border-radius:50%;background:var(--warm);flex-shrink:0;margin-top:4px"></div>` : ''}
      </div>
    `).join('') || `<div style="padding:48px;text-align:center;color:var(--text-muted);font-size:13.5px">No notifications yet.</div>`;
  }

  function markRead(id, el) {
    const n = NOTIFS.find(n => n.id === id);
    if (n) { n.unread = false; el.style.background = 'var(--surface)'; const dot = el.querySelector('[style*="var(--warm)"]'); if (dot) dot.remove(); }
  }

  function markAllRead() {
    NOTIFS.forEach(n => n.unread = false);
    renderNotifs(NOTIFS);
    showToast('All notifications marked as read');
  }

  renderNotifs(NOTIFS);
</script>
</body>
</html>
